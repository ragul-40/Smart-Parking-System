<title>Smart Parking System with IoT</title>
<style>
  body { font-family: Arial, sans-serif; text-align: center; margin: 20px; }
  #status { margin-bottom: 20px; font-size: 1.2em; }
  .parking-lot { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
  .parkingspot { width: 150px; height: 50px; line-height: 50px; color: #fff; font-weight: bold; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
  .available { background-color: green; }
  .occupied { background-color: red; }
</style>
</head>
<body>

<h1>Smart Parking System with IoT</h1>
<div>Total Slots: 10</div>
<div class="parking-lot" id="parkingLot"></div>

<script>
  const totalSlots = 10;
  // Initialize all slots as available (true = available, false = occupied)
  const parkingSlots = Array(totalSlots).fill(true);

  const parkingLotDiv = document.getElementById('parkingLot');

  // Function to render all slots
  function renderSlots() {
    parkingLotDiv.innerHTML = '';
    for (let i = 0; i < totalSlots; i++) {
      const slotDiv = document.createElement('div');
      slotDiv.className = 'parkingspot ' + (parkingSlots[i] ? 'available' : 'occupied');
      slotDiv.innerText = `Slot ${i + 1} - ${parkingSlots[i] ? 'Available' : 'Occupied'}`;
      parkingLotDiv.appendChild(slotDiv);
    }
  }

  // Example: simulate sensor data update
  // You should replace this with real sensor data update code
  function updateSlotStatus(slotIndex, isAvailable) {
    parkingSlots[slotIndex] = isAvailable;
    renderSlots();
  }

  // Simulate some slots being occupied
  setTimeout(() => { updateSlotStatus(0, false); }, 2000); // Slot 1 occupied after 2 sec
  setTimeout(() => { updateSlotStatus(3, false); }, 4000); // Slot 4 occupied after 4 sec
  setTimeout(() => { updateSlotStatus(7, false); }, 6000); // Slot 8 occupied after 6 sec

  // Initial render
  renderSlots();

  // Here you should connect your sensor data source, e.g., WebSocket or API, and call updateSlotStatus() accordingly
</script>

</body>

  <meta charset="UTF-8" />

  <title>Smart Parking System with IoT</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; margin: 20px; }

<body>
  <h1>Smart Parking System with IoT</h1>
  <div id="status">Connecting to sensor data...</div>
  <div class="parking-lot" id="parkingLot"></div>

  <script>
    const totalSlots = 10;
    const parkingSlots = Array(totalSlots).fill(false); // false = occupied, true = available

    const parkingLotDiv = document.getElementById('parkingLot');
    const statusDiv = document.getElementById('status');

    function renderSlots() {
      parkingLotDiv.innerHTML = '';
      for (let i = 0; i < totalSlots; i++) {
        const slotDiv = document.createElement('div');
        slotDiv.className = 'parkingspot ' + (parkingSlots[i] ? 'available' : 'occupied');
        slotDiv.innerText = 'Slot ' + (i + 1);
        parkingLotDiv.appendChild(slotDiv);
      }
    }

    // Connect to WebSocket server (replace with your server URL)
    const socket = new WebSocket('ws://your-server-address');

    socket.onopen = () => {
      statusDiv.innerText = 'Connected to sensor data.';
    };

    socket.onmessage = (event) => {
      // Expect data format: { slot: 1, occupied: true/false }
      const data = JSON.parse(event.data);
      const slotIndex = data.slot - 1;
      parkingSlots[slotIndex] = !data.occupied; // true = available
      renderSlots();
    };

    socket.onerror = () => {
      statusDiv.innerText = 'Error connecting to sensor data.';
    };

    // Initial rendering
    renderSlots();
  </script>
</body>
